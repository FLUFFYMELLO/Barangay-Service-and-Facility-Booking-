<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to the website</title>
    <link rel="stylesheet" href="../../css/User-side/login.css">
</head>

<body>
    <!-- the very background -->
    <div class="website-container">

        <!-- the white space to place the login form -->
        <div class="login-container">

            <!-- the login form -->
            <div class="login-form-container">
                <img id="logo-placeholder" src="https://th.bing.com/th/id/OIP.9ThwTpyI3OzYvVlFDG9hZgHaEr?w=248&h=180&c=7&r=0&o=7&pid=1.7&rm=3">
                <h1>WELCOME TO THE BARANGAY SYSTEM</h1>
                <input type="text" placeholder="Username" id="username" class="login-form">
                <input type="password" placeholder="Password" id="password" class="login-form">
                <button id="login-btn" class="button">Log In</button>
                <button id="register-btn" href="register.html" class="button">Register</button>
            </div>
        </div>
    </div>
</body>

</html>
